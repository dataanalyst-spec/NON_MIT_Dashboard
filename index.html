<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f9;--c:#fff;--t:#16213a;--m:#6a7389;--b:#e4e8f0;--navy:#0f2747;--off:#2563eb;--dig:#7c3aed;--ok:#059669}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(120deg,#0f2747,#1d3f72);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:21px;letter-spacing:.2px}header small{opacity:.75;display:block;font-size:12px;margin-top:2px}
.pill{background:rgba(255,255,255,.14);padding:6px 12px;border-radius:20px;font-size:12px;display:flex;gap:8px;align-items:center}
.pill button{background:#fff;color:var(--navy);border:0;border-radius:12px;padding:3px 10px;cursor:pointer;font-weight:600}
main{padding:20px 28px;max-width:1560px;margin:auto}
.tabs{display:flex;gap:6px;background:#e4e8f0;padding:5px;border-radius:12px;width:fit-content;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:9px 20px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-weight:600;color:var(--m);font-size:14px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(15,39,71,.05)}
.card h2{font-size:16px;margin:0 0 3px;display:flex;align-items:center;gap:10px;color:var(--navy)}
.card h2 i{font-style:normal;background:var(--navy);color:#fff;width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;font-size:12px}
.sub{color:var(--m);font-size:12.5px;margin:0 0 12px 34px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;flex-direction:column;gap:4px}
select{padding:8px 10px;border:1px solid var(--b);border-radius:8px;font-size:13px;min-width:130px;background:#fff;color:var(--t)}
.btn{padding:9px 16px;border:1px solid var(--b);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--b);border-left:4px solid var(--a,#2563eb);border-radius:12px;padding:14px 16px}
.kpi span{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi b{display:block;font-size:28px;color:var(--navy);margin-top:2px}.kpi em{font-style:normal;font-size:12px;color:var(--m)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bar div.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{background:#eef1f7;border-radius:6px;height:12px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--col,#2563eb)}
.bar .v{text-align:right;color:var(--m)}.bar .v b{color:var(--t)}
.sc{overflow-x:auto;border:1px solid var(--b);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;padding:10px 12px;text-align:center;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #edf0f6;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1}td:first-child{background:#fff;font-weight:600}
tr:hover td{background:#f7f9fd}tr:hover td:first-child{background:#f7f9fd}
td.tt,th.tt{background:#eef2fa;font-weight:700;color:var(--navy)}th.tt{background:#1d3f72;color:#fff}
tr.tot td{background:#eef2fa;font-weight:700;color:var(--navy);border-top:2px solid var(--navy)}
.msg{font-size:12.5px;color:var(--m);padding:10px 0}.err{color:#b91c1c}
.ins{background:#eff6ff;border:1px solid #cfe0ff;border-radius:10px;padding:12px 16px;margin-bottom:18px;color:#1e3a8a;font-size:13.5px}
details{margin-top:10px}summary{cursor:pointer;color:var(--m);font-size:12px}
@media print{.filters,.tabs,.pill,details{display:none}body{background:#fff}}
</style></head><body>
<header><div><h1>Lead Performance Dashboard</h1><small>Offline &amp; Digital lead management report</small></div>
<div class="pill"><span id="status">Connecting…</span><button onclick="load()">Refresh</button><button onclick="window.print()">Print</button></div></header>
<main>
<div class="tabs" id="tabs"><button data-t="btl" class="on">Offline Leads</button><button data-t="nik">Digital Leads</button><button data-t="all">Final Report · Offline + Digital</button></div>
<div class="card"><div class="filters">
<label>Period<select id="q"><option value="">All time</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="thisweek">This week</option><option value="lastweek">Last week</option><option value="thismonth">Current month</option></select></label>
<label>Date<select id="fd"></select></label><label>Week<select id="fw"></select></label>
<label>Month<select id="fm"></select></label><label>Year<select id="fy"></select></label>
<label>Lead owner<select id="fo"></select></label>
<button class="btn" onclick="resetF()">Reset filters</button></div>
<div class="msg" id="dinfo" style="padding-bottom:0"></div>
<details><summary>Column settings &amp; stage names</summary><div class="filters" id="map" style="margin-top:10px"></div></details></div>
<div id="out"></div></main>
<script>
const KEY="2PACX-1vToiYHVT7kgStYbZgL2G-5jlDgjfP_DnhC3OBArYEWNhLU8Ohp5qH9C1L9-yl-WEH2cuqheZ3kzqjYy";
const BASE="https://docs.google.com/spreadsheets/d/e/"+KEY+"/pub";
const NAMES={btl:"Offline Leads",nik:"Digital Leads"},COL={btl:"#2563eb",nik:"#7c3aed",all:"#0f2747"};
const raw={btl:{h:[],r:[]},nik:{h:[],r:[]}},map={btl:{},nik:{}};let tab="btl",loaded=false;
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,"0");
const dk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),mk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x},wk=d=>dk(mon(d));
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mlab=k=>MN[+k.slice(5)-1]+" "+k.slice(0,4);
const wlab=k=>{const s=new Date(k+"T00:00"),e=new Date(s);e.setDate(e.getDate()+6);const f=d=>d.getDate()+" "+MN[d.getMonth()];return f(s)+" – "+f(e)};
const dlab=k=>{const d=new Date(k+"T00:00");return d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear()};
function parseCSV(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}
else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";R.push(r);r=[]}else c+=ch}
if(c||r.length){r.push(c);R.push(r)}return R}
let SWAP=true;try{SWAP=localStorage.getItem("swap")!=="0"}catch(e){}
function setSwap(v){SWAP=v=="1";try{localStorage.setItem("swap",v)}catch(e){}render()}
function pDate(v){if(v==null||v==="")return null;if(v instanceof Date)return isNaN(v)?null:v;
if(typeof v==="number"){const u=new Date(Math.round((v-25569)*864e5)),y=u.getUTCFullYear(),m=u.getUTCMonth()+1,d=u.getUTCDate();return SWAP&&d<=12?new Date(y,d-1,m):new Date(y,m-1,d)}
const s=String(v).trim();if(/^\d{5}(\.\d+)?$/.test(s))return pDate(+s);let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m){const dd=+m[1],mm=+m[2];return mm>=1&&mm<=12&&dd>=1&&dd<=31?new Date(+m[3],mm-1,dd):null}
m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
const d=new Date(s);return isNaN(d)?null:d}
const clean=v=>{const s=String(v??"").trim();return /^(na|n\/a|nan|null|none|nil|-|--)$/i.test(s)?"":s};

function setData(k,rows){rows=rows.filter(r=>r.some(v=>String(v).trim()!==""));let hi=0,best=0;
rows.slice(0,10).forEach((r,i)=>{const n=r.filter(v=>String(v).trim()!=="").length;if(n>best){best=n;hi=i}});
raw[k].h=(rows[hi]||[]).map(x=>String(x).replace(/\s+/g," ").trim());raw[k].r=rows.slice(hi+1);autoMap(k)}
function autoMap(k){const h=raw[k].h,f=re=>h.findIndex(x=>re.test(x));const u=f(/sub.?stage|sub.?status|sub.?stg/i);
const numFrac=i=>{const v=raw[k].r.slice(0,300).map(r=>String(r[i]??"").trim()).filter(x=>x&&!/^na$/i.test(x));return v.length?v.filter(x=>/^\d+(\.\d+)?$/.test(x)).length/v.length:1};
const cand=h.map((x,i)=>i).filter(i=>/stage|status/i.test(h[i])&&i!==u).sort((a,b)=>((numFrac(a)>.5)-(numFrac(b)>.5))||(/^\s*lead\s*stage\s*$/i.test(h[b])-/^\s*lead\s*stage\s*$/i.test(h[a]))||(/stage/i.test(h[b])-/stage/i.test(h[a]))||numFrac(a)-numFrac(b));
const s=cand.length?cand[0]:-1;
const dsc=i=>{const v=raw[k].r.slice(0,300).map(r=>r[i]).filter(x=>x!==""&&x!=null);if(!v.length)return 0;return v.filter(x=>typeof x=="number"&&x>30000||x instanceof Date||(typeof x=="string"&&/\d/.test(x)&&/[\/\-.]|[A-Za-z]{3}/.test(x)&&pDate(x))).length/v.length};
const dc=h.map((x,i)=>i).filter(i=>/regist|creat|date|time/i.test(h[i])&&!/name|mobile|phone|email/i.test(h[i])&&(dsc(i)>.5||/user.*regist/i.test(h[i]))).sort((a,b)=>(/user.*regist/i.test(h[b])-/user.*regist/i.test(h[a]))||(/regist/i.test(h[b])-/regist/i.test(h[a]))||dsc(b)-dsc(a));
let d=dc.length?dc[0]:-1;let o=f(/lead.*owner|owner|assign|rm|executive/i);
map[k]={o,s,u,d}}
let LBL={};try{LBL=JSON.parse(localStorage.getItem("stageLbl")||"{}")}catch(e){}
function setLbl(v,t){LBL[v]=t.trim();try{localStorage.setItem("stageLbl",JSON.stringify(LBL))}catch(e){}render()}
function lblBox(){const set=new Set();["btl","nik"].forEach(k=>{if(map[k].s>=0)raw[k].r.forEach(r=>{const v=clean(r[map[k].s]);if(v)set.add(v)})});
const vals=[...set];if(!vals.length||!vals.every(v=>/^\d+(\.\d+)?$/.test(v)))return"";
return vals.sort((a,b)=>a-b).map(v=>`<label>Stage ${v} name<input style="padding:8px;border:1px solid #e4e8f0;border-radius:8px" value="${LBL[v]||""}" placeholder="e.g. New" onchange="setLbl('${v}',this.value)"></label>`).join("")}
function buildMap(){let h="";for(const k of["btl","nik"]){const hs=raw[k].h;if(!hs.length)continue;
for(const[f,l]of[["o","Lead owner"],["s","Lead stage"],["u","Lead substage"],["d","Registration date"]])
h+=`<label>${NAMES[k]} · ${l}<select onchange="map['${k}'].${f}=+this.value;render()"><option value="-1">— none —</option>${hs.map((x,i)=>`<option value="${i}" ${map[k][f]==i?"selected":""}>${x||"(col "+(i+1)+")"}</option>`).join("")}</select></label>`}
h+=`<label>Sheet date cells (real dates)<select onchange="setSwap(this.value)"><option value="1" ${SWAP?"selected":""}>Day/month were swapped by Sheets (fix)</option><option value="0" ${SWAP?"":"selected"}>Already correct</option></select></label>`;$("map").innerHTML=h+lblBox();const lb=lblBox();if(lb)document.querySelector("details").open=true}

async function fromXlsx(){const r=await fetch(BASE+"?output=xlsx");if(!r.ok)throw 0;
const wb=XLSX.read(await r.arrayBuffer(),{type:"array"});const N=wb.SheetNames;
const pick=(re,fb)=>wb.Sheets[N.find(n=>re.test(n))||N[fb]];
const g=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
setData("btl",g(pick(/btl/i,0)));setData("nik",g(pick(/nikhil/i,1)))}
async function fromCsv(){const h=await(await fetch(BASE+"html")).text();
const m=[...h.matchAll(/name:\s*"([^"]+)"[^}]*?gid:\s*"(\d+)"/g)];if(!m.length)throw 0;
const gid=re=>(m.find(x=>re.test(x[1]))||[])[2];
const get=async g=>parseCSV(await(await fetch(BASE+"?output=csv&gid="+g)).text());
setData("btl",await get(gid(/btl/i)??m[0][2]));setData("nik",await get(gid(/nikhil/i)??m[1][2]))}
async function load(){const st=$("status");st.className="";st.textContent="Syncing data…";
try{try{await fromXlsx()}catch(e){await fromCsv()}loaded=true;
st.textContent=`● Live · ${raw.btl.r.length} offline · ${raw.nik.r.length} digital · ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;buildMap();render()}
catch(e){st.textContent="Could not reach the sheet. Check it is published to the web, then Refresh."}}

function recs(k){const m=map[k],g=(r,i)=>i>=0?r[i]:"";return raw[k].r.map(r=>({o:clean(g(r,m.o)).replace(/\s*\([^)]*@[^)]*\)/,"")||"Unassigned",s:(x=>LBL[x]||x)(clean(g(r,m.s)))||"Not Updated",u:clean(g(r,m.u)),d:pDate(g(r,m.d)),src:k}))}
const base=()=>tab=="all"?recs("btl").concat(recs("nik")):recs(tab);
function fill(id,vals,lab){const el=$(id),cur=el.value;el.innerHTML='<option value="">All</option>'+vals.map(v=>`<option value="${v}">${lab?lab(v):v}</option>`).join("");if(vals.includes(cur))el.value=cur}
const uniq=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y));
function resetF(){["q","fd","fw","fm","fy","fo"].forEach(i=>$(i).value="");render()}
function filt(a){const q=$("q").value,n=new Date(),td=dk(n),yd=dk(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)),tw=wk(n),lw=wk(new Date(mon(n).getTime()-7*864e5)),tm=mk(n),v=i=>$(i).value;
return a.filter(x=>{if(v("fo")&&x.o!=v("fo"))return false;const d=x.d;
if(q||v("fd")||v("fw")||v("fm")||v("fy")){if(!d)return false;
if(q=="today"&&dk(d)!=td||q=="yesterday"&&dk(d)!=yd||q=="thisweek"&&wk(d)!=tw||q=="lastweek"&&wk(d)!=lw||q=="thismonth"&&mk(d)!=tm)return false;
if(v("fd")&&dk(d)!=v("fd")||v("fw")&&wk(d)!=v("fw")||v("fm")&&mk(d)!=v("fm")||v("fy")&&String(d.getFullYear())!=v("fy"))return false}return true})}

function pivot(a,rowF,colF,cols,colLab,title,o){const rows=[...new Set(a.map(rowF))];
if(!rows.length||!cols.length)return"<div class='msg'>No data for the selected filters.</div>";
const M={};a.forEach(x=>{const c=colF(x);if(c==null)return;const r=rowF(x);(M[r]??={})[c]=(M[r][c]||0)+1});
const T=r=>cols.reduce((s,c)=>s+((M[r]||{})[c]||0),0);rows.sort(o&&o.alpha?(x,y)=>x.localeCompare(y):(x,y)=>T(y)-T(x));const P=r=>cols.filter(c=>/payment/i.test(c)).reduce((s,c)=>s+((M[r]||{})[c]||0),0),pc=(p,t)=>t?(p/t*100).toFixed(2)+"%":"0.00%";let gp=0;
let mx=1;rows.forEach(r=>cols.forEach(c=>mx=Math.max(mx,(M[r]||{})[c]||0)));
const ct={};let g=0,h=`<div class="sc"><table><tr><th>${title}</th>${cols.map(c=>`<th>${colLab?colLab(c):c}</th>`).join("")}<th class="tt">Total</th>${o&&o.conv?"<th>Conversion %</th>":""}</tr>`;
rows.forEach(r=>{h+=`<tr><td>${r}</td>`+cols.map(c=>{const n=(M[r]||{})[c]||0;ct[c]=(ct[c]||0)+n;return`<td style="${n?`background:rgba(37,99,235,${(.08+.4*n/mx).toFixed(2)})`:"color:#b6bccb"}">${n||"–"}</td>`}).join("")+`<td class="tt">${T(r)}</td>${o&&o.conv?`<td>${pc(P(r),T(r))}</td>`:""}</tr>`;g+=T(r);gp+=P(r)});
return h+`<tr class="tot"><td>Grand total</td>${cols.map(c=>`<td>${ct[c]||0}</td>`).join("")}<td>${g}</td>${o&&o.conv?`<td>${pc(gp,g)}</td>`:""}</tr></table></div>`}

function periods(a,pred,withRate,allRef){const n=new Date(),tw=wk(n),tm=mk(n),A=a.filter(pred),R=a;
const set=[x=>x.d&&wk(x.d)==tw,x=>x.d&&mk(x.d)==tm,()=>true];const rows=uniq(A.map(x=>x.o));
if(!rows.length)return"<div class='msg'>No data.</div>";
const tot=[0,0,0];let h=`<div class="sc"><table><tr><th>Lead owner</th><th>This week leads</th><th>This month leads</th><th class="tt">Till now leads</th><th>Share %</th>${withRate?"<th>Visit rate %</th>":""}</tr>`;
const all=A.length;rows.sort((x,y)=>A.filter(p=>p.o==y).length-A.filter(p=>p.o==x).length);
rows.forEach(r=>{const v=set.map(s=>A.filter(x=>x.o==r&&s(x)).length);v.forEach((c,i)=>tot[i]+=c);
const lt=R.filter(x=>x.o==r).length;
h+=`<tr><td>${r}</td><td>${v[0]||"–"}</td><td>${v[1]||"–"}</td><td class="tt">${v[2]}</td><td>${(v[2]/all*100).toFixed(1)}%</td>${withRate?`<td>${lt?(v[2]/lt*100).toFixed(1):"0.0"}%</td>`:""}</tr>`});
return h+`<tr class="tot"><td>Grand total</td><td>${tot[0]}</td><td>${tot[1]}</td><td>${tot[2]}</td><td>100%</td>${withRate?`<td>${R.length?(tot[2]/R.length*100).toFixed(1):"0.0"}%</td>`:""}</tr></table></div>`}

function bars(list,col){const mx=Math.max(1,...list.map(x=>x[1])),t=list.reduce((s,x)=>s+x[1],0);
return list.map(([l,n])=>`<div class="bar"><div class="l" title="${l}">${l}</div><div class="tr"><i style="width:${n/mx*100}%;--col:${col}"></i></div><div class="v"><b>${n}</b> · ${(n/t*100).toFixed(0)}%</div></div>`).join("")||"<div class='msg'>No data.</div>"}
const cnt=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1])};
const card=(i,t,s,b)=>`<div class="card"><h2>${i?`<i>${i}</i>`:""}${t}</h2><p class="sub">${s}</p>${b}</div>`;

function render(){if(!loaded){$("out").innerHTML=card("","Loading…","Fetching live data from the sheet.","");return}
const all=base(),dd=all.filter(x=>x.d);
fill("fd",[...new Set(dd.map(x=>dk(x.d)))].sort().reverse(),dlab);fill("fw",[...new Set(dd.map(x=>wk(x.d)))].sort().reverse(),wlab);
fill("fm",[...new Set(dd.map(x=>mk(x.d)))].sort().reverse(),mlab);fill("fy",[...new Set(dd.map(x=>String(x.d.getFullYear())))].sort().reverse());
fill("fo",uniq(all.map(x=>x.o)));
{const ks=tab=="all"?["btl","nik"]:[tab],ds=all.filter(x=>x.d).map(x=>+x.d);
$("dinfo").innerHTML=`Date column: <b>${ks.map(k=>raw[k].h[map[k].d]||"not found").join(" / ")}</b> (dd/mm/yyyy) · ${ds.length} of ${all.length} leads have a valid date`+(ds.length?` · ${dlab(dk(new Date(Math.min(...ds))))} to ${dlab(dk(new Date(Math.max(...ds))))}`:"")+` · Today is ${dlab(dk(new Date()))}`}
const a=filt(all),isV=x=>/visit.*sched|sched.*visit/i.test(x.u),V=a.filter(isV).length,n=new Date(),tw=wk(n),tm=mk(n);
const stages=cnt(a,x=>x.s).map(x=>x[0]),weeks=[...new Set(a.filter(x=>x.d).map(x=>wk(x.d)))].sort(),months=[...new Set(a.filter(x=>x.d).map(x=>mk(x.d)))].sort();
const own=cnt(a,x=>x.o),col=COL[tab],name=tab=="all"?"Final Report · Offline + Digital Leads":NAMES[tab];
const K=(l,v,e,c)=>`<div class="kpi" style="--a:${c||col}"><span>${l}</span><b>${v}</b><em>${e||"&nbsp;"}</em></div>`;

  +`<label>From date<input type="date" data-k="from" value="${F.from}"></label><label>To date<input type="date" data-k="to" value="${F.to}"></label>`
  +(fill?"":sel("property","Property",PROPS.slice().sort().map(v=>[v,v])))
  +(!fill&&tab!=="scan"?`<div class="kpi ok"><span>${days.length===1?"Filled Properties":"Filled (property-days)"}</span><b>${f}</b></div>`
   +(tab==="area"?"":`<div class="kpi no"><span>${days.length===1?"Pending Properties":"Pending (property-days)"}</span><b>${ps.length*days.length-f}</b></div>`):"")
  +`<div class="note">${fmtS(R.s)} – ${fmtS(R.e)}</div>`;
 document.querySelectorAll("#filters [data-k]").forEach(s=>s.onchange=()=>{const k=s.dataset.k;F[k]=s.value;
  if(k==="from"||k==="to"){F.week="";F.day=""}
  else if(k==="week"){F.from=F.to="";F.day=""}
  else if(k==="day"){F.from=F.to="";F.week=""}
  else if(k==="year"||k==="month"){F.from=F.to="";F.week="";F.day=""}
  render()})}
function renderTabs(){
 $("#tabs").innerHTML=[...TASKS,{id:"scan",label:"Scanning"},{id:"fill",label:"Filling Rate"}].map(t=>`<button class="${tab===t.id?"on":""}" data-t="${t.id}">${t.label}</button>`).join("");
 document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}

const tbl=(h,b,f)=>`<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${b}</tbody>${f?`<tfoot>${f}</tfoot>`:""}</table></div>`;
const card=(t,inner,w)=>`<div class="card"${w?' style="grid-column:1/-1"':''}><h2>${t}</h2>${inner}</div>`;
function donut(f,t){const r=48,c=2*Math.PI*r,p=t?f/t:0;
 return `<svg viewBox="0 0 140 140" style="width:190px;display:block;margin:auto"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#f9cdd4" stroke-width="16"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="#8fd3b6" stroke-width="16" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 70 70)"/><text x="70" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="#25465f">${Math.round(p*100)}%</text></svg>
 <div class="leg"><span>&#9632; <span style="color:#5fb593">Filled ${f}</span></span><span>&#9632; <span style="color:#e58a98">Pending ${t-f}</span></span></div>`}
function snapshot(dm,ps,days){let f=0;ps.forEach(p=>days.forEach(k=>{if(dm.has(p+"|"+k))f++}));
 return `<div class="g2" style="margin-bottom:14px">`+card("Filled vs Pending",donut(f,ps.length*days.length))+"</div>"}

function taskView(tid){
 const T=TASKS.find(t=>t.id===tid),R=getRange(false),days=daysList(R),dm=doneMap(tid),ps=scopeProps();
 const seen=new Set(),data=rows.filter(o=>inScope(o,tid,R)).sort((a,b)=>(a.label||a.prop).localeCompare(b.label||b.prop)||a.k-b.k).filter(o=>{if(!o.grp)return true;if(seen.has(o.grp))return false;seen.add(o.grp);return true});
 const done=data.filter(o=>o.done),multi=days.length>1;
 const sumRows=days.map(k=>{const f=ps.filter(p=>dm.has(p+"|"+k)).length;return `<tr><td>${fmt(k)}</td><td>${f} Filled | ${ps.length-f} Pending</td></tr>`}).join("");
 const extra=[M.asg,M.by,M.sch,M.due,M.cat].filter(i=>i>=0);
 const compB=done.map(o=>`<tr><td>${o.label||o.prop}</td><td>${fmt(o.k)}</td>${extra.map(i=>`<td title="${o.v[i]||""}">${o.v[i]||""}</td>`).join("")}</tr>`).join("");
 const inc=[];days.forEach(k=>ps.forEach(p=>{if(!dm.has(p+"|"+k)){
  const rs=rows.filter(o=>o.tid===tid&&o.prop===p&&o.k===k),r=rs.find(o=>o.late)||rs[0];
  const lab=r?(r.late?`<span class="badge b-late">Completed late (${fmtS(r.ck)})</span>`:`<span class="badge b-no">${r.status||"Not completed"}</span>`):`<span class="badge b-no">Not submitted</span>`;
  inc.push(`<tr><td>${p}</td><td>${fmt(k)}</td><td>${lab}</td><td>${opManager(p)}</td></tr>`)}}));
 const wide=tid==="area"||tid==="om";
 let out=`<h1 class="title">${T.label}</h1>`+(tid==="ops"||tid==="round"?snapshot(dm,ps,days):"")+`<div class="g2">`
  +card(`Completed List (${done.length})`,tbl(["Property","Created Date",...extra.map(i=>cols[i])],compB||'<tr><td colspan="9">None</td></tr>'),wide)
  +(wide?"":card(`Incompleted List (${inc.length})`,tbl(["Property","Created Date","Status","Operation Manager"],inc.join("")||'<tr><td colspan="4">All properties completed on time</td></tr>')))
  +`</div><div style="height:14px"></div>`+(wide?"":card("Summary",tbl(["Day","Property Summary"],sumRows)));
 if(tid==="ops")out+=`<div class="g2" style="margin-top:14px">`+elecTables(R,days)+"</div>";
 const skip=new Set([M.task,M.prop,M.date,M.sch,M.due,M.cre,M.cat,M.y,M.mo,M.d,M.status,...extra]);
 const has=i=>data.some(o=>(o.v[i]||"").trim()!=="");
 const isUrl=i=>{const v=data.map(o=>(o.v[i]||'').trim()).filter(Boolean);return v.length&&v.filter(x=>/^https?:/i.test(x)).length/v.length>.5};
 let left=cols.map((_,i)=>i).filter(i=>!skip.has(i)&&!/photo/i.test(cols[i])&&!META.test(cols[i])&&!/porperty name|property name|name of the property/i.test(cols[i])&&has(i)&&!isUrl(i));
 const groups=[];
 T.panels.forEach(([n,re])=>{const g=left.filter(i=>re.test(cols[i]));left=left.filter(i=>!g.includes(i));if(g.length)groups.push([n,g])});
 if(left.length)groups.push(["Other details",left]);
 out+=`<div class="g2" style="margin-top:14px">`+groups.map(([n,g])=>{
  const body=data.filter(o=>g.some(i=>(o.v[i]||"").trim()!=="")).map(o=>`<tr><td>${o.label||o.prop}</td>${multi?`<td>${fmtS(o.k)}</td>`:""}`+g.map(i=>{const v=o.v[i]||"";return `<td${v.length>30?' class="t"':''} title="${v.replace(/"/g,"&quot;")}">${v}</td>`}).join("")+"</tr>").join("");
  const sums=g.map(i=>{const v=data.map(o=>(o.v[i]||"").trim()).filter(x=>x!=="");return v.length&&v.every(x=>!isNaN(x.replace(/,/g,"")))?Math.round(v.reduce((a,x)=>a+ +x.replace(/,/g,""),0)*100)/100:null});
  const foot=sums.some(s=>s!==null)?`<tr><td>Total</td>${multi?"<td></td>":""}${sums.map(s=>`<td>${s===null?"":s}</td>`).join("")}</tr>`:"";
  return card(n,tbl(["Property",...(multi?["Date"]:[]),...g.map(i=>cols[i])],body,foot),g.length>4||data.some(o=>g.some(i=>(o.v[i]||"").length>40)))}).join("")+"</div>";
 return out}

function elecTables(R,days){
 const ei=cols.findIndex(h=>/electricity units/i.test(h));if(ei<0)return"";
 const val={};rows.filter(o=>o.tid==="ops"&&o.k>=R.s&&o.k<=R.e).forEach(o=>{const v=(o.v[ei]||"").trim();if(v!==""&&!isNaN(v)){const q=o.prop+"|"+o.k;val[q]=(val[q]||0)+ +v}});
 const ps=F.property?[F.property]:PROPS.slice().sort(),one=P(R.s).m===P(R.e).m,lab=k=>one?P(k).d:P(k).d+"/"+P(k).m;
 const tot=days.map(k=>ps.reduce((a,p)=>a+(val[p+"|"+k]||0),0));
 const t1=tbl(["Property",...days.map(lab)],ps.map(p=>`<tr><td>${p}</td>${days.map(k=>`<td>${val[p+"|"+k]===undefined?"":Math.round(val[p+"|"+k])}</td>`).join("")}</tr>`).join(""),`<tr><td>Total</td>${tot.map(v=>`<td>${Math.round(v)}</td>`).join("")}</tr>`);
 const d2=days.slice(1);
 const t2=tbl(["Property",...d2.map(lab)],ps.map(p=>`<tr><td>${p}</td>${d2.map((k,i)=>{const a=val[p+"|"+k],b=val[p+"|"+days[i]];if(a===undefined||b===undefined)return"<td></td>";const x=Math.round(a-b);return `<td class="${x<0?"neg":""}">${x}</td>`}).join("")}</tr>`).join(""));
 return card("Electricity Consumption For the Property Day Wise",t1,true)+card("Cumulative Diff Electricity",t2,true)}

/* Filling rate: for each 7-day week, days achieved (completed on the scheduled day) ÷ days in the week */
function fillTable(tid,byOM,days,chunks){
 const dm=doneMap(tid),keys=byOM?["Arindam","Jayanta"]:PROPS,pOf=k=>byOM?PROPS.filter(p=>opManager(p)===k):[k];
 const rate=(ps,dd)=>{if(!dd.length)return null;let f=0;ps.forEach(p=>dd.forEach(k=>{if(dm.has(p+"|"+k))f++}));return f/(ps.length*dd.length)};
 const cell=v=>v===null?"<td></td>":`<td style="background:${v>=1?"var(--ok)":v>=.8?"var(--mid)":"var(--warn)"}">${(v*100).toFixed(2)}%</td>`;
 const L=keys.map(k=>({k,w:chunks.map(c=>rate(pOf(k),c)),t:rate(pOf(k),days)})).sort((a,b)=>(a.t??0)-(b.t??0));
 const body=L.map(l=>`<tr><td>${l.k}</td>${l.w.map(cell).join("")}${cell(l.t)}</tr>`).join("");
 const pc=v=>v===null?"":(v*100).toFixed(2)+"%";
 const foot=`<tr><td>Total</td>${chunks.map(c=>`<td>${pc(rate(PROPS,c))}</td>`).join("")}<td>${pc(rate(PROPS,days))}</td></tr>`;
 return tbl([byOM?"Operation Manager":"Property",...chunks.map((c,i)=>`Week ${i+1}<br><span class="th2">${fmtS(c[0])} – ${fmtS(c[c.length-1])}</span>`),"Total"],body,foot)}
function fillView(){
 const R=getRange(true),days=daysList(R),chunks=[];for(let i=0;i<days.length;i+=7)chunks.push(days.slice(i,i+7));
 const T=TASKS.filter(t=>t.id!=="om");
 return `<h1 class="title">Filling Rate</h1><div class="g2">`+T.map(t=>card(t.label+" Filling Rate",fillTable(t.id,false,days,chunks)+'<div style="height:12px"></div>'+fillTable(t.id,true,days,chunks),true)).join("")
 +`</div><p class="note">A day counts as achieved only when the task scheduled for that day was completed on the same day. A week with all 7 days achieved = 100%. Late completions do not count. Weeks are 7-day blocks (1–7, 8–14 …) of the selected month, or of the From/To range. The running week is measured on the days elapsed so far. Blue = 100%, purple = 80%+, pink = below 80%.</p>`}

/* ---------- Scanning: Order vs Consumption vs Scanned ---------- */
let scanRows=[],scanMsg="Scanning tab not loaded yet.",scanInfo="",SORT={col:0,dir:1};
try{const g=JSON.parse(localStorage.getItem("scanSrc")||"null");if(g&&g.gid){SCAN_SHEET_ID=g.id||"";SCAN_GID=g.gid}}catch(e){}
const num=v=>{v=(v||"").toString().replace(/,/g,"").trim();return v!==""&&!isNaN(v)?+v:null};
const mealOf=t=>{t=t||"";const m=MEALS.find(([,,re])=>re.test(t));return m?m[0]:null};
function hourOf(s){const m=(s||"").match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?/i);if(!m)return null;let h=+m[1];
 if(m[3]){const pm=/pm/i.test(m[3]);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}return h}
function loadScan(text){
 const t=parseCSV(text).filter(r=>r.some(x=>x.trim()));
 if(!t.length){scanMsg="The Scanning tab is empty.";scanRows=[];return}
 const h=t[0].map(x=>x.trim()),find=re=>h.findIndex(x=>re.test(x));
 if(find(/task\s*name/i)>=0){scanRows=[];scanMsg="That gid points to the Master tab, not the Scanning tab. Paste the Scanning tab's gid below.";return}
 const pi=find(/^property$/i)>=0?find(/^property$/i):find(/property|hostel|building|location|site/i);
 const yi=find(/^year$/i),mi=find(/^month$/i),di=find(/^day$/i);
 const dti=(()=>{const i=find(/^date$/i);return i>=0?i:find(/date|timestamp|time|scanned at/i)})();
 if(pi<0){scanRows=[];scanMsg="Couldn't find a Property column in the Scanning tab. Found: "+h.join(", ");return}
 // Layout A (wide): a column per meal, e.g. "Breakfast", "Lunch Scanned"
 const wide=MEALS.map(([id,,re])=>[id,h.findIndex(x=>re.test(x)&&!ORDER_RE.test(x)&&!CONSUME_RE.test(x))]).filter(([,i])=>i>=0);
 // Layout B (long): a meal column + an optional count column; with no count column every row = 1 scan
 const meali=find(/meal|session|slot|type|service/i);
 const cnti=h.findIndex((x,i)=>i!==dti&&i!==pi&&/count|scanned|scans|qty|quantity|total|no\.?\s*of|number/i.test(x));
 const out=[],skipped=new Set();
 t.slice(1).forEach(r=>{
  const prop=canon(r[pi]);if(!prop){if((r[pi]||"").trim())skipped.add(r[pi].trim());return}
  let dt=null;
  if(yi>=0&&mi>=0&&di>=0){const y=+r[yi],m=+r[mi],d=+r[di];if(y>2000&&m>=1&&m<=12&&d>=1&&d<=31)dt={y,m,d}}
  dt=dt||(dti>=0?parseDate(r[dti]):null);if(!dt||!dt.y)return;
  const k=key(dt.y,dt.m,dt.d);
  if(wide.length){wide.forEach(([meal,i])=>{const n=num(r[i]);if(n!==null)out.push({prop,k,meal,n})});return}
  let meal=meali>=0?mealOf(r[meali]):null;
  if(!meal&&dti>=0){const hr=hourOf(r[dti]);if(hr!==null)meal=hr<11?"breakfast":hr<16?"lunch":"dinner"}
  if(!meal)return;
  const n=cnti>=0?num(r[cnti]):1;if(n!==null)out.push({prop,k,meal,n})});
 scanRows=out;
 scanInfo=(wide.length?"Scanned read from columns: "+wide.map(([,i])=>h[i]).join(", ")
   :"Scanned read as "+(cnti>=0?`"${h[cnti]}"`:"1 per row")+(meali>=0?` by "${h[meali]}"`:" by scan time (before 11am breakfast, before 4pm lunch, after dinner)"))
   +(skipped.size?". Unmatched property names skipped: "+[...skipped].join(", "):"");
 scanMsg=out.length?"":"No usable rows found in the Scanning tab. Columns found: "+h.join(", ")}
async function fetchScan(){
 if(!SCAN_GID){scanMsg="Paste the Scanning tab link to load scanned counts.";if(rows.length&&tab==="scan")render();return}
 const urls=[];
 // 1) the spreadsheet itself (needs Share → "Anyone with the link" → Viewer)
 if(SCAN_SHEET_ID)urls.push(`https://docs.google.com/spreadsheets/d/${SCAN_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SCAN_GID}&headers=1`);
 // 2) fallback: the published Master workbook, if the Scanning tab lives there
 urls.push(`https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?output=csv&gid=${SCAN_GID}&single=true`);
 let txt=null;
 for(const u of urls){try{const r=await fetch(u);if(!r.ok)continue;const t=await r.text();
  if(/^\s*</.test(t))continue;   // got a Google login/HTML page instead of CSV
  txt=t;break}catch(e){}}
 if(txt===null){scanRows=[];scanMsg="Couldn't read the Scanning tab. In Google Sheets click Share → General access → \"Anyone with the link\" → Viewer, then click Reload."}
 else loadScan(txt);
 if(rows.length&&tab==="scan")render()}
function setScanGid(){const raw=($("#gidIn").value||"").trim();if(!raw)return;
 const id=(raw.match(/\/d\/([a-zA-Z0-9_-]{20,})/)||[])[1],g=(raw.match(/gid=(\d+)/)||raw.match(/^(\d+)$/)||[])[1];
 if(!g){scanMsg="That link has no gid=… part. Open the Scanning tab and copy the full address.";render();return}
 if(id)SCAN_SHEET_ID=id;SCAN_GID=g;
 try{localStorage.setItem("scanSrc",JSON.stringify({id:SCAN_SHEET_ID,gid:SCAN_GID}))}catch(e){}scanMsg="Loading…";render();fetchScan()}
function scanSort(c){SORT=SORT.col===c?{col:c,dir:-SORT.dir}:{col:c,dir:c?-1:1};render()}
function mealCols(re){return MEALS.map(([id,,mr])=>[id,cols.findIndex(h=>mr.test(h)&&re.test(h))])}
function scanView(){
 const R=getRange(false),ps=scopeProps();
 const oc=Object.fromEntries(mealCols(ORDER_RE)),cc=Object.fromEntries(mealCols(CONSUME_RE));
 const sum=(i,p)=>i<0?null:rows.filter(o=>o.tid==="ops"&&o.prop===p&&o.k>=R.s&&o.k<=R.e).reduce((a,o)=>{const n=num(o.v[i]);return n===null?a:(a??0)+n},null);
 const scanned=(meal,p)=>scanRows.filter(o=>o.meal===meal&&o.prop===p&&o.k>=R.s&&o.k<=R.e).reduce((a,o)=>(a??0)+o.n,null);
 const v=x=>x===null?"":Math.round(x*100)/100,neg=x=>x!==null&&x<0?' class="neg"':"";
 const heads=["Property","Ordered","Consumed","Difference","Scanned","Delta"];
 const cards=MEALS.map(([id,label])=>{
  let L=ps.map(p=>{const O=sum(oc[id],p),C=sum(cc[id],p),S=scanned(id,p)??(O!==null||C!==null?0:null);
   return{p,O,C,D:O!==null&&C!==null?O-C:null,S,X:C!==null&&S!==null?C-S:null}}).filter(r=>r.O!==null||r.C!==null||r.S!==null);
  const f=["p","O","C","D","S","X"][SORT.col];
  L.sort((a,b)=>SORT.col===0?a.p.localeCompare(b.p)*SORT.dir:((a[f]??-1e9)-(b[f]??-1e9))*SORT.dir);
  const T=k=>L.reduce((a,r)=>r[k]===null?a:(a??0)+r[k],null);
  const tot={O:T("O"),C:T("C"),D:T("D"),S:T("S"),X:T("X")};
  const th=heads.map((x,i)=>`<th onclick="scanSort(${i})">${x} <span class="ar">${SORT.col===i?(SORT.dir>0?"▲":"▼"):""}</span></th>`).join("");
  const body=L.map(r=>`<tr><td>${r.p}</td><td>${v(r.O)}</td><td>${v(r.C)}</td><td${neg(r.D)}>${v(r.D)}</td><td>${v(r.S)}</td><td${neg(r.X)}>${v(r.X)}</td></tr>`).join("")
   ||'<tr><td colspan="6">No data for this period</td></tr>';
  const foot=`<tr><td>Total</td><td>${v(tot.O)}</td><td>${v(tot.C)}</td><td${neg(tot.D)}>${v(tot.D)}</td><td>${v(tot.S)}</td><td${neg(tot.X)}>${v(tot.X)}</td></tr>`;
  return card(`${label} Order - Consumption with Scanning Delta`,`<div class="wrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`)}).join("");
 const used=MEALS.map(([id,label])=>`${label}: ${oc[id]>=0?`"${cols[oc[id]]}"`:"<b>no Ordered column</b>"} / ${cc[id]>=0?`"${cols[cc[id]]}"`:"<b>no Consumed column</b>"}`).join(" · ");
 const gidBox=`<div class="gidbox"><input id="gidIn" placeholder="Paste Scanning tab link" style="width:320px" value="${SCAN_SHEET_ID?`https://docs.google.com/spreadsheets/d/${SCAN_SHEET_ID}/edit?gid=${SCAN_GID}`:SCAN_GID}"><button onclick="setScanGid()">Load Scanning tab</button><button onclick="fetchScan()">Reload</button></div>`;
 return `<h1 class="title">Order - Consumption with Scanning Delta</h1>`
  +(scanMsg?`<div class="card"><div class="msg${/couldn't|master/i.test(scanMsg)?" err":""}" style="padding:10px">${scanMsg}</div>${gidBox}</div>`:"")
  +`<div class="g3">${cards}</div>`
  +`<p class="note">Difference = Ordered − Consumed. Delta = Consumed − Scanned. Ordered and Consumed come from the Daily Expenses / Ops Report (${used}). ${scanInfo}${scanMsg?"":` <a href="#" onclick="document.getElementById('gb').style.display='flex';return false">Change Scanning tab</a>`}</p>`
  +(scanMsg?"":`<div id="gb" style="display:none">${gidBox}</div>`)}

function tidy(){document.querySelectorAll(".g2").forEach(g=>{let col=0,prev=null;
 [...g.children].forEach(c=>{if(c.style.gridColumn){if(col===1&&prev)prev.style.gridColumn="1/-1";col=0;prev=null}else{prev=c;col=(col+1)%2;if(!col)prev=null}});
 if(col===1&&prev)prev.style.gridColumn="1/-1"})}
function render(){if(!rows.length)return;renderTabs();renderFilters();$("#view").innerHTML=tab==="fill"?fillView():tab==="scan"?scanView():taskView(tab);tidy()}
$("#reload").onclick=()=>{fetchSheet();fetchScan()};
$("#sfile").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{loadScan(t);tab="scan";render()})};
$("#file").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(load)};
fetchSheet();fetchScan();
</script>
